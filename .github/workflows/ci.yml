name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the version in a comment, so a moved tag
# cannot change what runs here. Dependabot keeps them up to date.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Built with the project's toolchain, so it understands Go 1.27.
          install-mode: goinstall

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The integration tests start Postgres with testcontainers.
      - run: make test-integration

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  compose:
    name: Local environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start everything and wait until it is healthy
        run: docker compose up --build --wait
      - name: Check readiness
        run: curl --fail --silent --show-error localhost:8080/readyz
      - name: Authenticate a seeded merchant
        run: |
          curl --fail --silent --show-error localhost:8080/v1/merchant \
            -H 'Authorization: Bearer sk_test_local_tienda_uno' | jq -e '.legal_name == "Tienda Uno SpA"'
      - name: Accept a payment, and replay it
        run: |
          token=$(curl --fail --silent --show-error localhost:8090/v1/tokens \
            -H 'Authorization: Bearer pk_sim_local_only' \
            -d '{"number":"4111111111111111","exp_month":12,"exp_year":2035,"cvc":"123"}' | jq -r .token)
          body="{\"order_id\":\"ci-1\",\"amount\":15000,\"currency\":\"CLP\",\"card_token\":\"$token\"}"
          pay() {
            curl --fail --silent --show-error --dump-header headers localhost:8080/v1/payments \
              -H 'Authorization: Bearer sk_test_local_tienda_uno' -H 'Idempotency-Key: ci-1' -d "$body"
          }
          id=$(pay | jq -er 'select(.status == "APPROVED" and .authorization_code != null) | .id')
          grep -q '^HTTP/1.1 201' headers
          test "$(pay | jq -r .id)" = "$id"
          grep -qi '^Idempotent-Replayed: true' headers
      - name: The payment's event reaches Kafka
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic payments.events.v1 --from-beginning \
            --max-messages 1 --timeout-ms 30000 | jq -e '.type == "payment.approved"'
      - name: Authorize a test card at the acquirer simulator
        run: |
          token=$(curl --fail --silent --show-error localhost:8090/v1/tokens \
            -H 'Authorization: Bearer pk_sim_local_only' \
            -d '{"number":"4111111111111111","exp_month":12,"exp_year":2035,"cvc":"123"}' | jq -r .token)
          curl --fail --silent --show-error localhost:8090/v1/authorizations \
            -H 'Authorization: Bearer sk_sim_local_only' -H 'Idempotency-Key: ci-1' \
            -d "{\"token\":\"$token\",\"amount\":15000,\"currency\":\"CLP\"}" | jq -e '.status == "approved"'
      # The recovery (RFC 0001, section 5.5), with the test cards of section 10.
      - name: A temporary error is finished in the background
        run: |
          . tests/compose/payments.sh
          test "$(pay ci-temporary 4000000000000127)" = 202
          settle ci-temporary 15 | jq -e '.status == "APPROVED" and
            [.history[] | select(.kind == "acquirer_call") | .outcome] == ["uncertain", "approved"]'
      - name: The API dies during its call, and the recovery finishes the payment
        run: |
          . tests/compose/payments.sh
          # The card answers after 8 s, so the API dies while it waits.
          (pay ci-killed 4000000000000135 || true) &
          sleep 2
          docker compose kill payments-api
          wait
          docker compose up --detach --wait payments-api
          p=$(settle ci-killed 40)
          jq -e '.status == "APPROVED"' <<<"$p"
          book "$(jq -r .id <<<"$p")" | jq -e 'length == 1 and .[0].live'
      - name: With Kafka down, the recovery finishes a payment, and its event waits
        run: |
          . tests/compose/payments.sh
          docker compose stop kafka
          test "$(pay ci-kafka-down 4000000000000127)" = 202
          id=$(settle ci-kafka-down 15 | jq -er 'select(.status == "APPROVED") | .id')
          docker compose up --detach --wait kafka
          # The four payments approved so far: ci-1 and the three above.
          events=$(docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic payments.events.v1 --from-beginning \
            --max-messages 4 --timeout-ms 60000)
          grep -q "$id" <<<"$events"
      - name: A payment that never gets an answer is reversed, and ends FAILED
        run: |
          . tests/compose/payments.sh
          test "$(pay ci-never 4000000000000150)" = 202
          p=$(settle ci-never 60)
          jq -e '.status == "FAILED" and .reason == "acquirer_unavailable"' <<<"$p"
          book "$(jq -r .id <<<"$p")" | jq -e 'length == 1 and .[0].reversed and (.[0].live | not)'
      - name: Show the logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes

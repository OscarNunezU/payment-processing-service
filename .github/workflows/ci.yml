name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the version in a comment, so a moved tag
# cannot change what runs here. Dependabot keeps them up to date.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Built with the project's toolchain, so it understands Go 1.27.
          install-mode: goinstall

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The integration tests start Postgres with testcontainers.
      - run: make test-integration

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build, with the type check
        run: npm run build
      - name: Known vulnerabilities
        run: npm audit --omit=dev

  compose:
    name: Local environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start everything and wait until it is healthy
        run: docker compose up --build --wait
      - name: Check readiness
        run: curl --fail --silent --show-error localhost:8080/readyz
      - name: Authenticate a seeded merchant
        run: |
          curl --fail --silent --show-error localhost:8080/v1/merchant \
            -H 'Authorization: Bearer sk_test_local_tienda_uno' | jq -e '.legal_name == "Tienda Uno SpA"'
      - name: Accept a payment, and replay it
        run: |
          token=$(curl --fail --silent --show-error localhost:8090/v1/tokens \
            -H 'Authorization: Bearer pk_sim_local_only' \
            -d '{"number":"4111111111111111","exp_month":12,"exp_year":2035,"cvc":"123"}' | jq -r .token)
          body="{\"order_id\":\"ci-1\",\"amount\":15000,\"currency\":\"CLP\",\"card_token\":\"$token\"}"
          pay() {
            curl --fail --silent --show-error --dump-header headers localhost:8080/v1/payments \
              -H 'Authorization: Bearer sk_test_local_tienda_uno' -H 'Idempotency-Key: ci-1' -d "$body"
          }
          id=$(pay | jq -er 'select(.status == "APPROVED" and .authorization_code != null) | .id')
          grep -q '^HTTP/1.1 201' headers
          test "$(pay | jq -r .id)" = "$id"
          grep -qi '^Idempotent-Replayed: true' headers
      - name: The payment's event reaches Kafka
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic payments.events.v1 --from-beginning \
            --max-messages 1 --timeout-ms 30000 | jq -e '.type == "payment.approved"'
      - name: Authorize a test card at the acquirer simulator
        run: |
          token=$(curl --fail --silent --show-error localhost:8090/v1/tokens \
            -H 'Authorization: Bearer pk_sim_local_only' \
            -d '{"number":"4111111111111111","exp_month":12,"exp_year":2035,"cvc":"123"}' | jq -r .token)
          curl --fail --silent --show-error localhost:8090/v1/authorizations \
            -H 'Authorization: Bearer sk_sim_local_only' -H 'Idempotency-Key: ci-1' \
            -d "{\"token\":\"$token\",\"amount\":15000,\"currency\":\"CLP\"}" | jq -e '.status == "approved"'
      # The recovery (RFC 0001, section 5.5), with the test cards of section 10.
      - name: A temporary error is finished in the background
        run: |
          . tests/compose/payments.sh
          test "$(pay ci-temporary 4000000000000127)" = 202
          settle ci-temporary 15 | jq -e '.status == "APPROVED" and
            [.history[] | select(.kind == "acquirer_call") | .outcome] == ["uncertain", "approved"]'
      - name: The API dies during its call, and the recovery finishes the payment
        run: |
          . tests/compose/payments.sh
          # The card answers after 8 s, so the API dies while it waits.
          (pay ci-killed 4000000000000135 || true) &
          sleep 2
          docker compose kill payments-api
          wait
          docker compose up --detach --wait payments-api
          p=$(settle ci-killed 40)
          jq -e '.status == "APPROVED"' <<<"$p"
          book "$(jq -r .id <<<"$p")" | jq -e 'length == 1 and .[0].live'
      - name: With Kafka down, the recovery finishes a payment, and its event waits
        run: |
          . tests/compose/payments.sh
          docker compose stop kafka
          test "$(pay ci-kafka-down 4000000000000127)" = 202
          id=$(settle ci-kafka-down 15 | jq -er 'select(.status == "APPROVED") | .id')
          docker compose up --detach --wait kafka
          # The four payments approved so far: ci-1 and the three above.
          events=$(docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic payments.events.v1 --from-beginning \
            --max-messages 4 --timeout-ms 60000)
          grep -q "$id" <<<"$events"
      - name: A payment that never gets an answer is reversed, and ends FAILED
        run: |
          . tests/compose/payments.sh
          test "$(pay ci-never 4000000000000150)" = 202
          p=$(settle ci-never 60)
          jq -e '.status == "FAILED" and .reason == "acquirer_unavailable"' <<<"$p"
          book "$(jq -r .id <<<"$p")" | jq -e 'length == 1 and .[0].reversed and (.[0].live | not)'
      # The webhooks (RFC 0001, section 9), received by the web app, which
      # answers 200 only to a valid signature.
      - name: Every final payment is delivered as a signed webhook
        run: |
          sql() { docker compose exec -T postgres psql -U "$1" -d "$1" -tAc "$2"; }
          final=$(sql payments "SELECT count(*) FROM payments WHERE status <> 'PROCESSING'")
          for _ in $(seq 30); do
            delivered=$(sql webhooks "SELECT count(*) FROM deliveries WHERE status = 'delivered'")
            [ "$delivered" = "$final" ] && break
            sleep 1
          done
          echo "$final final payments, $delivered webhooks delivered"
          test "$delivered" = "$final"
          test "$(sql webhooks "SELECT count(DISTINCT event_id) FROM deliveries")" = "$final"
          # The receiver shows each one with its signature verified.
          test "$(curl --fail --silent --show-error localhost:3000/webhooks | grep -o 'válida' | wc -l)" -ge "$final"
      # Observability (ADR 0006): metrics in Prometheus, traces in Tempo, and
      # Grafana with its dashboard. Metrics are pushed every 10 s.
      - name: Metrics, traces and the dashboard arrive
        run: |
          query() { curl --fail --silent --show-error --get localhost:9090/api/v1/query --data-urlencode "query=$1"; }
          for _ in $(seq 30); do
            query 'sum(payments_finished_total)' | jq -e '.data.result[0].value[1] | tonumber > 0' >/dev/null && break
            sleep 2
          done
          query 'sum(payments_finished_total)' | jq -e '.data.result[0].value[1] | tonumber > 0'
          query 'count(http_server_request_duration_seconds_bucket{job="payments-api"})' | jq -e '.data.result | length == 1'
          curl --fail --silent --show-error localhost:9090/api/v1/rules | jq -e '[.data.groups[].rules[].name] | index("PaymentsUnresolved")'
          # Tempo, through Grafana's data source.
          curl --fail --silent --show-error 'localhost:3001/api/datasources/proxy/uid/tempo/api/search?tags=service.name%3Dpayments-api&limit=5' \
            | jq -e '.traces | length > 0'
          curl --fail --silent --show-error localhost:3001/api/dashboards/uid/payments | jq -e '.dashboard.panels | length > 10'
      - name: The web app serves its pages
        run: |
          for page in / /checkout /webhooks /acquirer /api/health; do
            curl --fail --silent --show-error --output /dev/null "localhost:3000$page"
          done
      # A person's path through the web app, in a browser (web/e2e). Last, as
      # some tests switch the endpoint and the acquirer off for a while.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser tests
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Keep the browser report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Show the logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes

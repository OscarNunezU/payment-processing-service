name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the version in a comment, so a moved tag
# cannot change what runs here. Dependabot keeps them up to date.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Built with the project's toolchain, so it understands Go 1.27.
          install-mode: goinstall

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The integration tests start Postgres with testcontainers.
      - run: make test-integration

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  compose:
    name: Local environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start everything and wait until it is healthy
        run: docker compose up --build --wait
      - name: Check readiness
        run: curl --fail --silent --show-error localhost:8080/readyz
      - name: Authorize a test card at the acquirer simulator
        run: |
          token=$(curl --fail --silent --show-error localhost:8090/v1/tokens \
            -H 'Authorization: Bearer pk_sim_local_only' \
            -d '{"number":"4111111111111111","exp_month":12,"exp_year":2035,"cvc":"123"}' | jq -r .token)
          curl --fail --silent --show-error localhost:8090/v1/authorizations \
            -H 'Authorization: Bearer sk_sim_local_only' -H 'Idempotency-Key: ci-1' \
            -d "{\"token\":\"$token\",\"amount\":15000,\"currency\":\"CLP\"}" | jq -e '.status == "approved"'
      - name: Show the logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes

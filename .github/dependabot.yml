version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      testcontainers:
        patterns: ["github.com/testcontainers/*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      next:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

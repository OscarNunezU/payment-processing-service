services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      # Development key only ("dev-only-key-not-for-production!"); production
      # keys come from a secret manager, never from this file.
      CARD_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZHVjdGlvbiE=
      MAX_AMOUNT_CLP: "5000000"
      MAX_AMOUNT_USD: "500000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

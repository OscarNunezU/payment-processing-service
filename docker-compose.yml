services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 15

  acquirer-mock:
    build:
      context: ./backend
      target: acquirer-mock
    ports:
      - "8081:8081"

  api:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      # Development key only ("dev-only-key-not-for-production!"); production
      # keys come from a secret manager, never from this file.
      CARD_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZHVjdGlvbiE=
      MAX_AMOUNT_CLP: "5000000"
      MAX_AMOUNT_USD: "500000"
      ACQUIRER_URL: http://acquirer-mock:8081
      ACQUIRER_TIMEOUT: 5s
      WORKER_CONCURRENCY: "4"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      acquirer-mock:
        condition: service_started
    # Docker kills the container 10s after SIGTERM by default; payments in
    # flight get up to 15s to finish, so give it a little more.
    stop_grace_period: 20s

volumes:
  postgres-data:

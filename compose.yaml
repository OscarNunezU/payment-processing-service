# Local environment: `docker compose up --build --wait` starts everything and
# waits until it is healthy. Passwords here are for local development only.
name: payments-platform

x-go-service: &go-service
  build: .
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/local/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP, not the Unix socket: while the image runs its init scripts, a
      # temporary server answers on the socket only, and a socket check would
      # pass before the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U platform"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # A single broker locally; production would run three.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose, with their partitions and retention.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"

  acquirer-sim:
    <<: *go-service
    command: ["/acquirer-sim"]
    environment:
      # Keys for local development only.
      ACQUIRER_SECRET_KEY: sk_sim_local_only
      ACQUIRER_PUBLISHABLE_KEY: pk_sim_local_only
      ALLOWED_ORIGINS: http://localhost:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    # 8090 is the public port, for browsers and payments-worker. 8091 serves
    # the book and the faults, and keeps working while 8090 is down.
    ports:
      - "8090:8090"
      - "8091:8091"
    depends_on:
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8091/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate-payments:
    <<: *go-service
    restart: "no"
    command: ["/migrate", "payments", "up"]
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # The local merchants, with the API keys in the README.
  seed-payments:
    <<: *go-service
    restart: "no"
    command: ["/seed"]
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
    depends_on:
      migrate-payments:
        condition: service_completed_successfully

  payments-api:
    <<: *go-service
    command: ["/payments-api"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8080:8080"
    depends_on:
      seed-payments:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
    # In-flight requests get 20 s to finish, plus a margin (RFC 0001, section 5.6).
    stop_grace_period: 30s

volumes:
  postgres-data:

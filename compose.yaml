# Local environment: `docker compose up --build --wait` starts everything and
# waits until it is healthy. Passwords here are for local development only.
name: payments-platform

x-go-service: &go-service
  build: .
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/local/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP, not the Unix socket: while the image runs its init scripts, a
      # temporary server answers on the socket only, and a socket check would
      # pass before the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U platform"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # The data goes to a volume, so a recreated broker keeps its topics and
      # offsets. The default is /tmp, inside the container.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # A single broker locally; production would run three.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose, with their partitions and retention.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # The topics, with their partitions and retention (RFC 0001, section 8.1).
  # Creating them again changes nothing.
  kafka-topics:
    image: apache/kafka:4.1.1
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        topics=/opt/kafka/bin/kafka-topics.sh
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.events.v1 \
          --partitions 24 --replication-factor 1 --config retention.ms=604800000
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.dlq.v1 \
          --partitions 1 --replication-factor 1 --config retention.ms=2592000000
    depends_on:
      kafka:
        condition: service_healthy

  # Observability (ADR 0006): the services push traces to Tempo and metrics
  # to Prometheus over OTLP, and Grafana shows both.
  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/local/tempo.yaml:/etc/tempo.yaml:ro
    tmpfs:
      # Tempo runs as an unprivileged user.
      - /var/tempo:mode=1777

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      # The services push over OTLP, and Tempo writes the service graph.
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/local/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      # Local development only: no login, and the dashboards are files.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payments.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  acquirer-sim:
    <<: *go-service
    command: ["/acquirer-sim"]
    environment:
      # Keys for local development only.
      ACQUIRER_SECRET_KEY: sk_sim_local_only
      ACQUIRER_PUBLISHABLE_KEY: pk_sim_local_only
      ALLOWED_ORIGINS: http://localhost:3000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    # 8090 is the public port, for browsers and the payments services. 8091
    # serves the book and the faults, and keeps working while 8090 is down.
    ports:
      - "8090:8090"
      - "8091:8091"
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8091/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate-payments:
    <<: *go-service
    restart: "no"
    command: ["/migrate", "payments", "up"]
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # The local merchants, with the API keys in the README.
  seed-payments:
    <<: *go-service
    restart: "no"
    command: ["/seed", "payments"]
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
    depends_on:
      migrate-payments:
        condition: service_completed_successfully

  migrate-webhooks:
    <<: *go-service
    restart: "no"
    command: ["/migrate", "webhooks", "up"]
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # The webhook endpoints of the local merchants, with the secrets in the
  # README. They point at the web app, which plays the merchants.
  seed-webhooks:
    <<: *go-service
    restart: "no"
    command: ["/seed", "webhooks"]
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      LOCAL_WEBHOOK_URL: http://web:3000/api/webhooks
    depends_on:
      migrate-webhooks:
        condition: service_completed_successfully

  payments-api:
    <<: *go-service
    command: ["/payments-api"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      ACQUIRER_URL: http://acquirer-sim:8090
      ACQUIRER_SECRET_KEY: sk_sim_local_only
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "8080:8080"
    depends_on:
      seed-payments:
        condition: service_completed_successfully
      acquirer-sim:
        condition: service_healthy
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
    # In-flight requests get 20 s to finish, plus a margin (RFC 0001, section 5.6).
    stop_grace_period: 30s

  # The relay and the recovery. Its probes listen on 8081.
  payments-worker:
    <<: *go-service
    command: ["/payments-worker"]
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      ACQUIRER_URL: http://acquirer-sim:8090
      ACQUIRER_SECRET_KEY: sk_sim_local_only
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    depends_on:
      migrate-payments:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      acquirer-sim:
        condition: service_healthy
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8081/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

  # The consumer of the payment events, and the dispatcher of the webhooks.
  # Its probes listen on 8082.
  webhooks:
    <<: *go-service
    command: ["/webhooks"]
    environment:
      HTTP_ADDR: ":8082"
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    depends_on:
      seed-webhooks:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8082/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

  # The web app that plays the merchant: the checkout, the panel, and the
  # endpoint of the webhooks (RFC 0001, section 12). Keys for local
  # development only.
  web:
    build: ./web
    restart: unless-stopped
    environment:
      # Only the app's server reaches the API, with the merchant's secret key.
      API_URL: http://payments-api:8080
      MERCHANT_API_KEY: sk_test_local_tienda_uno
      # The browser tokenizes at the acquirer's public port, from the host.
      ACQUIRER_PUBLIC_URL: http://localhost:8090
      ACQUIRER_PUBLISHABLE_KEY: pk_sim_local_only
      ACQUIRER_ADMIN_URL: http://acquirer-sim:8091
      WEBHOOK_SECRETS: >-
        00000000-0000-4000-8000-000000000001=whsec_local_only_tienda_uno,00000000-0000-4000-8000-000000000002=whsec_local_only_tienda_dos,00000000-0000-4000-8000-000000000003=whsec_local_only_suspendida
    ports:
      - "3000:3000"
    depends_on:
      payments-api:
        condition: service_healthy
      acquirer-sim:
        condition: service_healthy
    healthcheck:
      # Distroless has no shell or curl: node itself asks.
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The load test of step 9 (tests/load/run.sh). A profile keeps it out of
  # `docker compose up`.
  k6:
    image: grafana/k6:2.2.0
    profiles: ["load"]
    volumes:
      - ./tests/load:/scripts:ro
    depends_on:
      payments-api:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:

\* The protocol as designed, with fairness: if the acquirers eventually answer,
\* every payment reaches a final state. Without repeated deliveries; see the
\* comment on Fairness in the spec.
SPECIFICATION Spec

CONSTANTS
    Acquirers = {"A", "B"}
    MaxAttempts = 2
    MaxCrashes = 1
    MaxInquiries = 2
    Duplicates = FALSE
    InquireOnTimeout = TRUE
    Tombstones = TRUE
    WriteAheadReversal = TRUE
    Fencing = TRUE
    ReverseWhenCardGone = TRUE

INVARIANTS
    TypeOK
    NoTwoLiveAuthorizations

PROPERTIES
    EventuallyFinal

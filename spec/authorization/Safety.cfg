\* The protocol as designed, with every safeguard on and a network that loses,
\* delays and repeats messages. TLC must find no violation of the invariants.
INIT Init
NEXT Next

CONSTANTS
    Acquirers = {"A", "B"}
    MaxAttempts = 2
    MaxCrashes = 1
    MaxInquiries = 2
    Duplicates = TRUE
    InquireOnTimeout = TRUE
    Tombstones = TRUE
    WriteAheadReversal = TRUE
    Fencing = TRUE
    ReverseWhenCardGone = TRUE

INVARIANTS
    TypeOK
    AtMostOneMaybeLive
    NoTwoLiveAuthorizations
    DatabaseTellsTheTruth
    MerchantToldTheTruth

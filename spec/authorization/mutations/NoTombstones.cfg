\* Mutation: a reversal for a key the acquirer has not seen leaves no trace, so a late request with that key can still be approved.
\* TLC must find a counterexample.
INIT Init
NEXT Next

CONSTANTS
    Acquirers = {"A", "B"}
    MaxAttempts = 2
    MaxCrashes = 1
    MaxInquiries = 2
    Duplicates = TRUE
    InquireOnTimeout = TRUE
    Tombstones = FALSE
    WriteAheadReversal = TRUE
    Fencing = TRUE
    ReverseWhenCardGone = TRUE

INVARIANTS
    NoTwoLiveAuthorizations
    DatabaseTellsTheTruth
    MerchantToldTheTruth

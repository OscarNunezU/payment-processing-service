\* Mutation: a process whose lease was taken over can still decide, for example that an operation was not sent.
\* TLC must find a counterexample.
INIT Init
NEXT Next

CONSTANTS
    Acquirers = {"A", "B"}
    MaxAttempts = 2
    MaxCrashes = 1
    MaxInquiries = 2
    Duplicates = TRUE
    InquireOnTimeout = TRUE
    Tombstones = TRUE
    WriteAheadReversal = TRUE
    Fencing = FALSE
    ReverseWhenCardGone = TRUE

INVARIANTS
    NoTwoLiveAuthorizations
    DatabaseTellsTheTruth
    MerchantToldTheTruth

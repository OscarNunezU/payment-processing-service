\* Mutation: an inquiry answers "not found" and there is no card data to resend, so the payment just fails, although the request may still be on its way.
\* TLC must find a counterexample.
INIT Init
NEXT Next

CONSTANTS
    Acquirers = {"A", "B"}
    MaxAttempts = 2
    MaxCrashes = 1
    MaxInquiries = 2
    Duplicates = TRUE
    InquireOnTimeout = TRUE
    Tombstones = TRUE
    WriteAheadReversal = TRUE
    Fencing = TRUE
    ReverseWhenCardGone = FALSE

INVARIANTS
    NoTwoLiveAuthorizations
    DatabaseTellsTheTruth
    MerchantToldTheTruth

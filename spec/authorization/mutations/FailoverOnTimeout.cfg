\* Mutation: a timeout is treated as "not sent", and the payment fails over to the other acquirer.
\* TLC must find a counterexample.
INIT Init
NEXT Next

CONSTANTS
    Acquirers = {"A", "B"}
    MaxAttempts = 2
    MaxCrashes = 1
    MaxInquiries = 2
    Duplicates = TRUE
    InquireOnTimeout = FALSE
    Tombstones = TRUE
    WriteAheadReversal = TRUE
    Fencing = TRUE
    ReverseWhenCardGone = TRUE

INVARIANTS
    NoTwoLiveAuthorizations
    DatabaseTellsTheTruth
    MerchantToldTheTruth

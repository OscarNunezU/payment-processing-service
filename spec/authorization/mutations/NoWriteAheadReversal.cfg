\* Mutation: recovery sends a reversal without recording the decision first, so a late approval can still be recorded as the outcome.
\* TLC must find a counterexample.
INIT Init
NEXT Next

CONSTANTS
    Acquirers = {"A", "B"}
    MaxAttempts = 2
    MaxCrashes = 1
    MaxInquiries = 2
    Duplicates = TRUE
    InquireOnTimeout = TRUE
    Tombstones = TRUE
    WriteAheadReversal = FALSE
    Fencing = TRUE
    ReverseWhenCardGone = TRUE

INVARIANTS
    NoTwoLiveAuthorizations
    DatabaseTellsTheTruth
    MerchantToldTheTruth

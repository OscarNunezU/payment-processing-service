version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    # The dependency rules of ADR 0004 and ADR 0001.
    depguard:
      rules:
        # Only the standard library, minus context. Tests may use more. A new
        # service adds its own domain here.
        domain:
          files:
            - "**/internal/*/domain/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/OscarNunezU/payment-processing-service/internal/payments/domain
            - github.com/OscarNunezU/payment-processing-service/internal/webhooks/domain
          deny:
            - pkg: context
              desc: "the domain is pure: context belongs to the use cases and adapters (ADR 0004)"
        use-cases:
          files:
            - "**/internal/*/app/**"
          deny:
            - pkg: github.com/OscarNunezU/payment-processing-service/internal/platform
              desc: "platform helpers are for adapters and cmd (ADR 0004)"
            - pkg: github.com/jackc/pgx
              desc: "SQL belongs in the Store adapter (ADR 0004)"
            - pkg: net/http
              desc: "HTTP belongs in the adapters (ADR 0004)"
            - pkg: github.com/twmb/franz-go
              desc: "Kafka belongs in its adapter (ADR 0004)"
        payments:
          files:
            - "**/internal/payments/**"
          deny:
            - pkg: github.com/OscarNunezU/payment-processing-service/internal/webhooks
              desc: "services talk through APIs and events, never through each other's packages (ADR 0001)"
            - pkg: github.com/OscarNunezU/payment-processing-service/internal/acquirersim
              desc: "services talk through APIs and events, never through each other's packages (ADR 0001)"
        webhooks:
          files:
            - "**/internal/webhooks/**"
          deny:
            - pkg: github.com/OscarNunezU/payment-processing-service/internal/payments
              desc: "services talk through APIs and events, never through each other's packages (ADR 0001)"
            - pkg: github.com/OscarNunezU/payment-processing-service/internal/acquirersim
              desc: "services talk through APIs and events, never through each other's packages (ADR 0001)"
        acquirersim:
          files:
            - "**/internal/acquirersim/**"
          deny:
            - pkg: github.com/OscarNunezU/payment-processing-service/internal/payments
              desc: "the simulator stands for another company: it shares no code with the service (ADR 0001)"
            - pkg: github.com/OscarNunezU/payment-processing-service/internal/webhooks
              desc: "the simulator stands for another company: it shares no code with the service (ADR 0001)"
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may ignore errors from cleanup and from deliberately broken input.
      - path: _test\.go
        linters:
          - gosec
      # The seed holds the keys and secrets of the local environment, which
      # the README publishes. No real credential lives in the repository.
      - path: cmd/seed/main\.go
        linters:
          - gosec
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/OscarNunezU/payment-processing-service
